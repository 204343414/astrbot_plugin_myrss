<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MyRSS 订阅总览</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div><h1>MyRSS 订阅总览</h1><p id="dataPath">正在读取正式数据文件…</p></div>
      <button id="refresh">刷新</button>
    </header>
    <section class="stats"><div><b id="groupCount">0</b><span>订阅群</span></div><div><b id="subCount">0</b><span>订阅关系</span></div><div><b id="blockedCount">0</b><span>近期安全拦截</span></div></section>
    <section id="safetyPanel" class="safety-panel hidden"></section>
    <section id="testStatus" class="test-status hidden" aria-live="polite"></section>
    <section class="workspace">
      <aside><input id="search" placeholder="筛选群号、平台" /><div id="groups" class="groups"></div></aside>
      <article id="detail"><div class="empty">选择左侧订阅群查看数据</div></article>
    </section>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
